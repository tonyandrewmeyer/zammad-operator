[project]
name = "zammad"
version = "0.1.0"
requires-python = ">=3.10"

# Dependencies of the charm code (src/) and vendored charm libraries.
# Vendored libs and their PYDEPS:
#   - charms.data_platform_libs.v0.data_interfaces  (ops)
#   - charms.grafana_agent.v0.cos_agent             (cosl>=0.0.50, pydantic)
#   - charms.tls_certificates_interface.v3.tls_certificates (cryptography, jsonschema)
dependencies = [
    "ops>=2.10,<4.0",
    "cosl>=0.0.50",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "jsonschema>=4.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[dependency-groups]
# Dependencies of linting and static type checks
lint = [
    "ruff>=0.16.0",
    "codespell",
    "pyright",
    "zizmor>=1.28.0",
]
# Dependencies of unit tests
unit = [
    "coverage[toml]",
    "ops[testing]",
    "pytest",
    "pyyaml>=6.0",
]
# Dependencies of integration tests
integration = [
    "jubilant",
    "pytest",
]

# Testing tools configuration
[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Linting tools configuration
[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage,uv.lock"
ignore-words-list = ["aNULL"]
[tool.pyright]
include = ["src", "tests"]
exclude = ["lib", "build", ".tox"]
extraPaths = ["lib", "src"]

[tool.ruff]
line-length = 99
extend-exclude = [
    "__pycache__",
    "*.egg_info",
    "lib",
    ".tox",
    "build",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "C4",
    "N",
    "D",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806", "D"]
